name: Atualizar dashboard de commodities

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 09:00 UTC (06:00 em Brasília)
  workflow_dispatch:       # botão "Run workflow" para rodar manualmente

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Coletar dados das APIs
        run: python scripts/update_data.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Publicar data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "chore: dados de $(date -u +%F)" && git push)
