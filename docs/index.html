<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indexadores globais de matérias-primas</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #141311;
      --surface: #1d1c19;
      --surface-2: #24231f;
      --border: #32302b;
      --text: #f3f1ec;
      --muted: #a39e93;
      --accent: #0f766e;
      --accent-bright: #14b8a6;
      --accent-soft: rgba(20, 184, 166, 0.14);
      --up: #ef5350;      /* Alta = pressão de custo */
      --down: #22c55e;    /* Queda = alívio / oportunidade */
      --warn: #eab308;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
    }

    [data-theme="light"] {
      --bg: #f6f5f2;
      --surface: #ffffff;
      --surface-2: #efede8;
      --border: #dcd8ce;
      --text: #1c1b18;
      --muted: #666158;
      --accent: #0f766e;
      --accent-bright: #0d9488;
      --accent-soft: rgba(15, 118, 110, 0.10);
      --up: #dc2626;
      --down: #16a34a;
      --warn: #ca8a04;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
      padding-bottom: 48px;
    }

    .container {
      max-width: 1380px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .error-toggle {
      background: none;
      border: none;
      color: var(--warn);
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    .error-box {
      display: none;
      background: var(--surface);
      border: 1px solid var(--warn);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .error-box.open { display: block; }
    .error-box ul { margin-left: 18px; margin-top: 6px; }

    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { border-color: var(--accent-bright); }
    .btn-accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .btn-accent:hover { filter: brightness(1.1); }

    /* Tabs */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tab {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab:hover { border-color: var(--accent-bright); }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .tab.insights-tab {
      border-color: var(--accent-bright);
    }

    /* Section Headers */
    .section-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.35rem;
      margin: 24px 0 14px;
      color: var(--text);
    }
    .section-title:first-child { margin-top: 0; }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }
    .card:hover { border-color: var(--muted); }
    .card.selected {
      border: 2px solid var(--accent-bright);
      padding: 15px 17px;
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 4px;
    }

    .card-name {
      font-size: 1.02rem;
      font-weight: 700;
    }

    .card-check {
      width: 17px;
      height: 17px;
      accent-color: #3b82f6;
      cursor: pointer;
      margin-top: 2px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent-bright);
      letter-spacing: 0.03em;
    }
    .badge.stale {
      background: rgba(234, 179, 8, 0.15);
      color: var(--warn);
    }

    .card-value-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }

    .card-value {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card-unit {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .card-date {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .card-stats {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-label { color: var(--muted); }
    .val-up { color: var(--up); font-weight: 600; }
    .val-down { color: var(--down); font-weight: 600; }
    .val-flat { color: var(--muted); font-weight: 600; }

    /* Chart Panel */
    .chart-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-top: 26px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .chart-controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .range-btn {
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .range-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .chart-wrap {
      position: relative;
      height: 330px;
      width: 100%;
    }

    /* Insights View */
    .insights-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .summary-box {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent-bright);
      border-radius: 10px;
      padding: 18px 22px;
    }

    .summary-box h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .summary-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.94rem;
    }

    .semaphore-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .sem-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sem-col.buy { border-top: 3px solid var(--down); }
    .sem-col.alert { border-top: 3px solid var(--up); }
    .sem-col.neutral { border-top: 3px solid var(--warn); }

    .sem-header h3 { font-size: 1rem; margin-bottom: 4px; }
    .sem-tip { font-size: 0.82rem; color: var(--muted); }

    .sem-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
    }

    .sem-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .sem-item-name { font-weight: 600; font-size: 0.9rem; }
    .sem-item-sub { font-size: 0.78rem; color: var(--muted); }

    /* BRL Effect Table */
    .panel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
    }

    .panel-card h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .panel-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .num { text-align: right; }

    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .pill-green { background: rgba(34, 197, 94, 0.14); color: var(--down); }
    .pill-red { background: rgba(239, 83, 80, 0.14); color: var(--up); }
    .pill-yellow { background: rgba(234, 179, 8, 0.15); color: var(--warn); }

    /* Negotiation Generator */
    .neg-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    select {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      min-width: 240px;
    }

    .neg-output {
      width: 100%;
      min-height: 115px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 0.92rem;
      line-height: 1.5;
      resize: vertical;
      margin-bottom: 10px;
    }

    .hidden { display: none !important; }
    .empty-msg { color: var(--muted); font-size: 0.86rem; padding: 8px 0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Indexadores globais de matérias-primas</h1>
        <div class="subtitle" id="meta-line">Carregando dados...</div>
      </div>
      <button class="btn" id="theme-toggle">Claro / Escuro</button>
    </header>

    <div class="error-box" id="error-box"></div>

    <nav class="tabs" id="tabs"></nav>

    <!-- Visão de Cards + Gráfico -->
    <main id="cards-view">
      <div id="cards-container"></div>

      <section class="chart-panel" id="chart-panel">
        <div class="chart-header">
          <div>
            <strong id="chart-title">Comparativo histórico</strong>
            <div style="font-size:0.8rem;color:var(--muted)" id="chart-subtitle">
              Marque os cards acima para comparar tendências (normalizado em Base 100 quando há 2+ séries)
            </div>
          </div>
          <div class="chart-controls">
            <button class="range-btn" data-days="30">1M</button>
            <button class="range-btn" data-days="90">3M</button>
            <button class="range-btn active" data-days="180">6M</button>
            <button class="range-btn" data-days="365">1A</button>
            <button class="range-btn" data-days="9999">Tudo</button>
            <button class="btn" id="clear-selection" style="padding:5px 10px;font-size:0.8rem">Limpar</button>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="history-chart"></canvas>
        </div>
      </section>
    </main>

    <!-- Visão de Insights do Comprador -->
    <main id="insights-view" class="insights-stack hidden"></main>
  </div>

  <script>
    const STATE = {
      raw: null,
      series: [],
      activeTab: 'Todas',
      selectedIds: new Set(['BRENT']),
      rangeDays: 180,
      chart: null
    };

    const COLORS = ['#14b8a6', '#f59e0b', '#3b82f6', '#ec4899', '#a855f7', '#22c55e', '#ef4444'];

    // Tema Claro / Escuro
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      renderChart();
    });

    // Formatadores
    function fmtNum(val) {
      if (val == null || Number.isNaN(val)) return '—';
      const dec = Math.abs(val) >= 1000 ? 0 : Math.abs(val) < 10 ? 3 : 2;
      return val.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    function fmtPct(pct) {
      if (pct == null || Number.isNaN(pct)) return '—';
      const sign = pct > 0 ? '+' : '';
      return `${sign}${pct.toFixed(2).replace('.', ',')}%`;
    }

    function fmtDate(ms) {
      return new Date(ms).toLocaleDateString('pt-BR', { timeZone: 'UTC' });
    }

    function pctBadgeHtml(pct) {
      if (pct == null || Number.isNaN(pct)) return `<span class="val-flat">—</span>`;
      if (pct > 0.005) return `<span class="val-up">▲ ${fmtPct(pct)}</span>`;
      if (pct < -0.005) return `<span class="val-down">▼ ${fmtPct(pct)}</span>`;
      return `<span class="val-flat">• 0,00%</span>`;
    }

    // Cálculo de métricas por série
    function enrichSeries(s) {
      const pts = (s.points || []).filter(p => p && p[1] != null);
      if (!pts.length) return { ...s, lastVal: null, lastTs: null, dayPct: null, monthPct: null };

      const last = pts[pts.length - 1];
      const prev = pts.length > 1 ? pts[pts.length - 2] : null;
      const dayPct = prev && prev[1] !== 0 ? ((last[1] - prev[1]) / Math.abs(prev[1])) * 100 : null;

      let monthPct = dayPct;
      if (s.freq === 'diária' && pts.length > 2) {
        const targetTs = last[0] - 30 * 86400000;
        let ref = pts[0];
        for (const p of pts) {
          if (Math.abs(p[0] - targetTs) < Math.abs(ref[0] - targetTs)) ref = p;
        }
        monthPct = ref[1] !== 0 ? ((last[1] - ref[1]) / Math.abs(ref[1])) * 100 : null;
      }

      return {
        ...s,
        points: pts,
        lastTs: last[0],
        lastVal: last[1],
        dayPct,
        monthPct
      };
    }

    // Carregar dados
    async function init() {
      try {
        const res = await fetch('./data.json?t=' + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        STATE.raw = data;
        STATE.series = (data.series || []).map(enrichSeries);

        if (!STATE.series.some(s => s.id === 'BRENT') && STATE.series.length) {
          STATE.selectedIds = new Set([STATE.series[0].id]);
        }

        renderHeader();
        renderTabs();
        renderCurrentView();
      } catch (err) {
        document.getElementById('meta-line').textContent = `Erro ao carregar data.json (${err.message})`;
      }
    }

    function renderHeader() {
      const dtStr = STATE.raw.generated_at
        ? new Date(STATE.raw.generated_at).toLocaleString('pt-BR')
        : '—';
      const errs = STATE.raw.errors || [];
      const meta = document.getElementById('meta-line');
      const errBox = document.getElementById('error-box');

      meta.innerHTML = `
        <span>Atualizado em <strong>${dtStr}</strong></span>
        <span>·</span>
        <span>${STATE.series.length} séries</span>
        ${errs.length ? `<span>·</span><button class="error-toggle" id="err-btn">${errs.length} com falha na última coleta</button>` : ''}
      `;

      if (errs.length) {
        errBox.innerHTML = `<strong>Falhas na última coleta automática:</strong><ul>${errs.map(e => `<li>${e}</li>`).join('')}</ul>`;
        document.getElementById('err-btn').addEventListener('click', () => {
          errBox.classList.toggle('open');
        });
      }
    }

    function renderTabs() {
      const cats = [...new Set(STATE.series.map(s => s.cat))];
      const allTabs = ['Todas', ...cats, 'Insights do Comprador'];
      const nav = document.getElementById('tabs');
      nav.innerHTML = '';

      allTabs.forEach(tab => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (STATE.activeTab === tab ? ' active' : '') + (tab === 'Insights do Comprador' ? ' insights-tab' : '');
        btn.textContent = tab === 'Insights do Comprador' ? '✦ Insights do Comprador' : tab;
        btn.addEventListener('click', () => {
          STATE.activeTab = tab;
          renderTabs();
          renderCurrentView();
        });
        nav.appendChild(btn);
      });
    }

    function renderCurrentView() {
      const cardsView = document.getElementById('cards-view');
      const insightsView = document.getElementById('insights-view');

      if (STATE.activeTab === 'Insights do Comprador') {
        cardsView.classList.add('hidden');
        insightsView.classList.remove('hidden');
        renderInsights();
      } else {
        insightsView.classList.add('hidden');
        cardsView.classList.remove('hidden');
        renderCards();
        renderChart();
      }
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      const filtered = STATE.activeTab === 'Todas'
        ? STATE.series
        : STATE.series.filter(s => s.cat === STATE.activeTab);

      const groups = [...new Set(filtered.map(s => s.cat))];

      groups.forEach(cat => {
        const h2 = document.createElement('h2');
        h2.className = 'section-title';
        h2.textContent = cat;
        container.appendChild(h2);

        const grid = document.createElement('div');
        grid.className = 'grid';

        filtered.filter(s => s.cat === cat).forEach(s => {
          const isSel = STATE.selectedIds.has(s.id);
          const card = document.createElement('div');
          card.className = 'card' + (isSel ? ' selected' : '');
          card.innerHTML = `
            <div class="card-top">
              <div class="card-name">${s.name}</div>
              <input type="checkbox" class="card-check" ${isSel ? 'checked' : ''} aria-label="Selecionar ${s.name}">
            </div>
            <div class="card-meta">
              <span>${s.freq}</span>
              <span class="badge ${s.stale ? 'stale' : ''}">${s.stale ? 'CACHE' : 'API'}</span>
            </div>
            <div class="card-value-row">
              <span class="card-value">${fmtNum(s.lastVal)}</span>
              <span class="card-unit">${s.unit}</span>
            </div>
            <div class="card-date">${s.lastTs ? fmtDate(s.lastTs) : '—'}</div>
            <div class="card-stats">
              <div class="stat-row">
                <span class="stat-label">${s.freq === 'diária' ? 'Dia' : 'Últ. período'}</span>
                ${pctBadgeHtml(s.dayPct)}
              </div>
              <div class="stat-row">
                <span class="stat-label">Mês</span>
                ${pctBadgeHtml(s.monthPct)}
              </div>
            </div>
          `;

          card.addEventListener('click', (e) => {
            if (STATE.selectedIds.has(s.id)) STATE.selectedIds.delete(s.id);
            else STATE.selectedIds.add(s.id);
            renderCards();
            renderChart();
          });

          grid.appendChild(card);
        });

        container.appendChild(grid);
      });
    }

    function renderChart() {
      const selected = STATE.series.filter(s => STATE.selectedIds.has(s.id));
      const canvas = document.getElementById('history-chart');
      const titleEl = document.getElementById('chart-title');
      const subEl = document.getElementById('chart-subtitle');

      if (STATE.chart) STATE.chart.destroy();

      if (!selected.length) {
        titleEl.textContent = 'Nenhum indexador selecionado';
        subEl.textContent = 'Clique em um ou mais cards acima para visualizar a evolução histórica.';
        return;
      }

      const normalize = selected.length > 1;
      titleEl.textContent = normalize
        ? `Comparativo normalizado (Base 100) — ${selected.length} séries`
        : `${selected[0].name} (${selected[0].unit})`;
      subEl.textContent = normalize
        ? 'Todas as séries iniciam em 100 no começo do período selecionado para comparar tendências.'
        : 'Valores nominais da série selecionada.';

      const maxTs = Math.max(...selected.map(s => s.lastTs || 0));
      const cutoff = STATE.rangeDays >= 9999 ? 0 : maxTs - STATE.rangeDays * 86400000;

      // Coletar todas as datas únicas ordenadas
      const dateSet = new Set();
      const seriesMaps = selected.map(s => {
        const pts = s.points.filter(p => p[0] >= cutoff);
        const base = pts.length ? pts[0][1] : 1;
        const map = new Map();
        pts.forEach(([ts, v]) => {
          const key = new Date(ts).toISOString().slice(0, 10);
          dateSet.add(key);
          map.set(key, normalize ? (v / base) * 100 : v);
        });
        return { series: s, map };
      });

      const labels = [...dateSet].sort();
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
      const tickColor = isDark ? '#a39e93' : '#666158';

      const datasets = seriesMaps.map((item, idx) => ({
        label: item.series.name,
        data: labels.map(d => item.map.has(d) ? item.map.get(d) : null),
        borderColor: COLORS[idx % COLORS.length],
        backgroundColor: COLORS[idx % COLORS.length],
        borderWidth: 2,
        pointRadius: labels.length > 60 ? 0 : 2.5,
        spanGaps: true,
        tension: 0.15
      }));

      STATE.chart = new Chart(canvas, {
        type: 'line',
        data: {
          labels: labels.map(d => d.split('-').reverse().join('/')),
          datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { labels: { color: tickColor } },
            tooltip: {
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: ${fmtNum(ctx.parsed.y)}${normalize ? ' pts' : ' ' + selected[ctx.datasetIndex].unit}`
              }
            }
          },
          scales: {
            x: { ticks: { color: tickColor, maxTicksLimit: 10 }, grid: { color: gridColor } },
            y: { ticks: { color: tickColor }, grid: { color: gridColor } }
          }
        }
      });
    }

    // Controles do gráfico
    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        STATE.rangeDays = Number(btn.dataset.days);
        renderChart();
      });
    });

    document.getElementById('clear-selection').addEventListener('click', () => {
      STATE.selectedIds.clear();
      renderCards();
      renderChart();
    });
